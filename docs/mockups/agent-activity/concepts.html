<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-activity · display concepts</title>
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
/* Paseo default theme, limited to the 11 PluginTheme.colors tokens a plugin receives.
   --s3/--xmuted/--run are aliases of those tokens, never extra colors. */
.t-light,.t-dark{--s3:var(--border);--xmuted:var(--muted);--run:var(--accent)}
.t-light{--s0:#ffffff;--s1:#fafafa;--s2:#f4f4f5;--fg:#1a1a1e;--muted:#71717a;--border:#e4e4e7;--accent:#20744A;--ok:#3e704a;--bad:#9d433b;--warn:#7b5d39;--sidebar:#f4f4f5;--sel:#20744A33}
.t-dark{--s0:#181B1A;--s1:#1E2120;--s2:#272A29;--fg:#fafafa;--muted:#A1A5A4;--border:#252B2A;--accent:#20744A;--ok:#6cb17b;--bad:#d8847b;--warn:#c09664;--sidebar:#141716;--sel:#20744A66}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:var(--sidebar);color:var(--fg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke-width:1.75;display:block}
.ico{display:inline-flex;align-items:center}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.pulse::after{animation:none!important}}

/* ---------- mockup chrome ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--s0)}
.bar h1{font-size:13px;font-weight:600;margin:0 6px 0 0;white-space:nowrap}
.bar h1 span{color:var(--muted);font-weight:400}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--s2);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--s0);color:var(--fg);box-shadow:0 1px 2px #0000001f}
.btn{border:1px solid var(--border);background:var(--s0);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--s1)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.clock{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.canvas{display:flex;justify-content:center;padding:20px;min-height:0;overflow:hidden}
.side{border-left:1px solid var(--border);background:var(--s0);display:flex;flex-direction:column;min-height:0}
.side section{padding:14px 16px;border-bottom:1px solid var(--border)}
.side h2{font-size:12px;font-weight:600;margin:0 0 8px;color:var(--fg)}
.side p{margin:0;color:var(--muted);font-size:12.5px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rules li{font-size:12.5px;padding:4px 8px;border-radius:6px;color:var(--muted);transition:background .4s,color .4s}
.rules li b{color:var(--fg);font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
.rules li.hit{background:var(--s2);color:var(--fg)}
.log{flex:1;overflow:auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:6px}
.log div{font-size:12px;color:var(--muted);display:grid;grid-template-columns:40px 1fr;gap:6px}
.log div span:first-child{font-family:var(--mono);color:var(--xmuted);font-variant-numeric:tabular-nums}
.log div em{font-style:normal;color:var(--fg)}

/* ---------- Paseo frame ---------- */
.frame{width:min(920px,100%);height:100%;background:var(--s0);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 24px -12px #0000002e}
.frame.compact{width:390px}
.fhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.fhead .title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead .prov{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tl{flex:1;overflow:auto;padding:18px 0 28px}
.tl-inner{max-width:760px;margin:0 auto;padding:0 20px}
.compact .tl-inner{padding:0 12px}
.user{display:flex;justify-content:flex-end;margin:22px 0 14px}
.user:first-child{margin-top:0}
.user div{background:var(--s2);border-radius:14px;padding:8px 12px;max-width:80%}
.turnend{font-size:12px;color:var(--xmuted);margin:10px 0 0}
.composer{border-top:1px solid var(--border);padding:10px 14px}
.composer>div:last-child{border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--xmuted);font-size:13.5px}

/* shared card atoms */
.sum.prose-sum{font-family:var(--ui);font-size:13px}
.sum{font-family:var(--mono);font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--muted)}
.st{display:inline-flex;color:var(--xmuted)}
.st svg.i{width:14px;height:14px}
.is-running .st,.is-running .ico{color:var(--fg)}
.is-failed .st,.is-failed .ico{color:var(--bad)}
.is-failed .sum,.is-failed .meta{color:var(--bad)}
.is-done .st{color:var(--ok)}
.is-canceled .sum{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--xmuted)}
.is-canceled .st{color:var(--muted)}
.hd{all:unset;box-sizing:border-box;cursor:pointer}
.hd.static{cursor:default}
.body{font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--fg);white-space:pre;overflow-x:auto;margin:0}
.body .add{color:var(--ok)}.body .del{color:var(--bad)}.body .hunk{color:var(--muted)}
.more{font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:4px}
.details{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-bottom:8px}
.details dt{color:var(--muted)}.details dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.errtext{font-family:var(--mono);font-size:12px;color:var(--bad);margin-top:8px;white-space:pre-wrap}
.prose{font-size:14px;line-height:1.6;color:var(--fg)}
.prose p{margin:0 0 8px}.prose p:last-child{margin:0}
.prose ul{margin:0 0 8px;padding-left:18px}
.prose code{font-family:var(--mono);font-size:12.5px;background:var(--s2);padding:1px 4px;border-radius:4px}
.thinking{font-size:13px;line-height:1.55;color:var(--muted);white-space:pre-wrap}
.caret::after{content:"";display:inline-block;width:6px;height:13px;margin-left:2px;vertical-align:-2px;background:var(--run);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ========== Plugin off · approximated Paseo default ========== */
.s-off .drow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:4px 0}
.s-off .drow b{font-weight:500;color:var(--fg)}
.s-off .drow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-off .dans{margin:8px 0}
.s-off .derr{color:var(--bad);font-size:13px;margin:6px 0}

/* ========== concepts ========== */
.dim{color:var(--muted)}
.steprow{display:grid;grid-template-columns:16px minmax(0,1fr) auto 14px;align-items:center;gap:8px;width:100%;min-height:26px;padding:0 6px;border-radius:6px}
.steprow:hover{background:var(--s1)}
.steprow .ico,.steprow .st{color:var(--muted)}
.steprow .sum{color:var(--muted);font-size:12px}
.steprow .meta{font-size:11.5px}
.steprow svg.i{width:14px;height:14px}
.is-running .steprow .sum{color:var(--fg)}
.is-failed .steprow .sum{color:var(--bad)}
.stepbody{margin:2px 6px 8px 30px;padding:8px 10px;background:var(--s1);border:1px solid var(--border);border-radius:6px}
.answerblk{margin:10px 0}
.errline{display:flex;gap:8px;align-items:flex-start;color:var(--bad);font-size:13px;margin:6px 0}
.toggle{all:unset;cursor:pointer;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:2px 6px;margin-left:-6px;border-radius:6px}
.toggle:hover{background:var(--s2);color:var(--fg)}
.toggle svg.i{width:14px;height:14px}
.now{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.now .sum{color:var(--fg)}
.now svg.i{width:14px;height:14px}

/* 1 · phase loop */
.loop{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px}
.ph{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.ph svg.i{width:13px;height:13px}
.ph.done{color:var(--fg)}
.ph.done .st{color:var(--ok)}
.ph.failed{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.ph.running{color:var(--fg);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ph small{font-size:11px;color:var(--muted)}
.arrow{color:var(--muted);font-size:12px}
.blk{margin:8px 0 10px;display:grid;gap:6px}

/* 2 · composer pill */
.track{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cpill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted);max-width:100%}
.cpill svg.i{width:13px;height:13px}
.cpill .sum{font-size:12px}
.cpill.live{color:var(--fg);border-color:var(--accent)}
.cpill.bad{color:var(--bad)}
.cpill button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

/* 3 · footprint */
.strip{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:8px 0 2px}
.tile{all:unset;cursor:pointer;position:relative;width:24px;height:24px;border-radius:6px;background:var(--s2);display:grid;place-items:center;color:var(--muted)}
.tile svg.i{width:13px;height:13px}
.tile:hover{color:var(--fg)}
.tile.sel{outline:1px solid var(--fg);outline-offset:1px}
.tile.running{color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.running::after{content:"";position:absolute;inset:-3px;border-radius:8px;border:1px solid var(--accent);animation:ring2 1.6s cubic-bezier(.16,1,.3,1) infinite}
@keyframes ring2{0%{opacity:.8}100%{opacity:0;transform:scale(1.25)}}
.tile.failed{background:color-mix(in srgb,var(--bad) 16%,var(--s0));color:var(--bad)}
.tile.canceled{opacity:.45}
.tile.edit{color:var(--fg)}
.cap{font-size:12px;color:var(--muted);margin-bottom:8px}
.tiledetail{margin:4px 0 10px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--s1)}
.tiledetail .hdr{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}

/* 4 · net result */
.result{border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:10px 0;margin:10px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.result dt{color:var(--muted)}
.result dd{margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;min-width:0}
.result .item{display:inline-flex;gap:6px;align-items:center;min-width:0}
.result .item svg.i{width:13px;height:13px}
.result .ok{color:var(--ok)}.result .bad{color:var(--bad)}
.result .mono{font-family:var(--mono);font-size:12.5px}

/* 5 · by object */
.split{display:flex;flex:1;min-height:0}
.split .tl{flex:1}
.objpanel{width:280px;border-left:1px solid var(--border);overflow:auto;padding:12px 14px;display:none}
.c-object .objpanel{display:block}
.compact .objpanel{display:none!important}
.objpanel h3{font-size:12px;font-weight:600;margin:0 0 4px;color:var(--fg)}
.objpanel .sec{margin-bottom:14px}
.objpanel .sec>.lbl{display:block;margin-bottom:4px;font-size:11.5px}
.obj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 6px;border-radius:6px;margin:0 -6px}
.obj.live{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.obj .sum{font-size:12px}
.obj .ops{grid-column:1/-1;font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.obj .ops svg.i{width:12px;height:12px}
.obj .ops .ok{color:var(--ok)}.obj .ops .bad{color:var(--bad)}
.objsheet{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;max-height:220px;overflow:auto}

/* 6 · quiet unless exceptional */
.flag{font-size:12px;color:var(--bad);display:flex;gap:6px;align-items:center;margin:0 6px 2px 30px}
.flag.warn{color:var(--warn)}
.flag svg.i{width:13px;height:13px}
.exc .steprow{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.exc.long .steprow{background:color-mix(in srgb,var(--warn) 9%,transparent)}
.exc .steprow .sum{color:var(--fg)}

/* 7 · time bar */
.tbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:1px;margin:10px 0 4px;background:var(--s2)}
.tbar span{min-width:2px;height:100%}
.tbar .explore{background:color-mix(in srgb,var(--fg) 22%,transparent)}
.tbar .think{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.tbar .change{background:color-mix(in srgb,var(--fg) 50%,transparent)}
.tbar .verify{background:color-mix(in srgb,var(--fg) 75%,transparent)}
.tbar .failed{background:var(--bad)}
.tbar .running{background:var(--accent)}
.tlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}
.tlegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.side .feas{display:grid;gap:8px}
.side .feas div{font-size:12.5px;color:var(--muted)}
.side .feas b{color:var(--fg);font-weight:600;display:block;margin-bottom:1px}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <h1>agent-activity <span>concepts</span></h1>
    <div class="grp"><label>Ý tưởng</label><div class="seg" data-key="concept">
      <button data-v="phase">1 Pha</button><button data-v="composer">2 Composer</button><button data-v="footprint">3 Dấu chân</button><button data-v="result">4 Kết quả</button><button data-v="object">5 Đối tượng</button><button data-v="quiet">6 Im lặng</button><button data-v="time">7 Thời gian</button><button data-v="combo">1+2+4</button></div></div>
    <div class="grp"><label>Plugin</label><div class="seg" data-key="plugin"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="grp"><label>Provider</label><div class="seg" data-key="provider"><button data-v="claude">Claude Code</button><button data-v="codex">Codex</button><button data-v="omp">OMP</button></div></div>
    <div class="grp"><label>Theme</label><div class="seg" data-key="theme"><button data-v="light" aria-label="Light theme" data-icon="sun"></button><button data-v="dark" aria-label="Dark theme" data-icon="moon"></button></div></div>
    <div class="grp"><label>Layout</label><div class="seg" data-key="layout"><button data-v="desktop" aria-label="Desktop" data-icon="monitor"></button><button data-v="compact" aria-label="Compact" data-icon="smartphone"></button></div></div>
    <div class="grp">
      <button class="btn primary" id="play"></button>
      <button class="btn" id="step" data-icon="skip-forward">Step</button>
      <button class="btn" id="end">Finish turn</button>
      <button class="btn" id="reset" data-icon="rotate-ccw">Reset</button>
      <div class="seg" data-key="speed"><button data-v="0.5">0.5×</button><button data-v="1">1×</button><button data-v="2">2×</button></div>
      <span class="clock" id="clock">0:00</span>
    </div>
  </header>
  <div class="stage">
    <div class="canvas">
      <div class="frame" id="frame">
        <div class="fhead"><span class="title">Fix UTC date formatter</span><span class="prov" id="prov"></span></div>
        <div class="split"><div class="tl" id="tl"><div class="tl-inner" id="tlin"></div></div><aside class="objpanel" id="objpanel" aria-label="Touched"></aside></div>
        <div class="composer"><div id="sheet"></div><div class="track" id="pills"></div><div>Message the agent…</div></div>
      </div>
    </div>
    <aside class="side">
      <section><h2 id="optname"></h2><p id="optdesc"></p></section>
      <section><h2>Đánh giá</h2><div class="feas" id="feas"></div></section>
      <section style="border-bottom:0;padding-bottom:0"><h2>What just happened</h2></section>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>

  if(v.activity==="error")return `<div class="derr">${esc(v.summary)}</div>`;
  const ic=v.status==="running"?svg("loader-circle","spin"):svg("chevron-right");
  const tail=v.activity==="think"?"":` <span>${esc(v.summary)}</span>`;
  return `<div class="drow">${ic}<b>${esc(raw)}</b>${tail}</div>`;
}



/* ================= concepts ================= */
S.concept="combo";S.open={};S.steps={};S.sel={};S.sheet=false;
const PHASE={think:"explore",search:"explore",read:"explore",web:"explore",delegate:"explore",tool:"explore",plan:"explore",edit:"change",write:"change",run:"verify"};
const PH_LABEL={explore:"Explore",change:"Change",verify:"Verify"};
const LONG_MS=4000; // demo threshold; the real rule would be ~30s
const CONCEPTS={
  phase:["1 · Vòng lặp pha","Mỗi turn chỉ còn một dòng pha Explore → Change → Verify. Lặp lại nghĩa là agent phải sửa lại; chi tiết nằm sau nút Show steps.",
    [["Giữ tập trung","Timeline không mọc card; chỉ một dòng pha đổi trạng thái."],["Cách làm","Transformer trả [] cho tool/reasoning; một dòng tóm tắt theo dõi timeline của agent và tự gom pha."],["Rủi ro","Cần API theo dõi timeline trong SDK plugin; phân loại pha theo detail.type có thể sai với lệnh không phải test."]]],
  composer:["2 · Dòng sống ở composer","Việc đang chạy hiện ở pill trên thanh composer, cạnh pill usage. Timeline chỉ có dòng mờ, không tự mở.",
    [["Giữ tập trung","Chỗ bạn đang đọc không bị đẩy; liếc xuống composer là biết agent làm gì."],["Cách làm","addComposerPill + update() theo timeline subscription; transformer vẽ dòng mờ."],["Rủi ro","Tần suất update() của pill; pill chỉ thấy khi đang mở agent đó."]]],
  footprint:["3 · Dấu chân","Mỗi hành động là một ô nhỏ trên một dòng, như lịch sử commit. Chạm một ô để xem chi tiết ngay dưới dòng.",
    [["Giữ tập trung","Cả turn 11 bước chỉ cao một dòng; hình dạng dòng tự kể chuyện (nhiều đọc, có ✕)."],["Cách làm","Gom các item liên tiếp thành một dải; cần gom nhiều item thành một hàng."],["Rủi ro","Transformer chỉ thấy từng item; phải vẽ dải bằng component theo dõi timeline, các item gốc trả []."]]],
  result:["4 · Kết quả ròng","Khi chạy: một dòng việc hiện tại. Khi xong: khối Result nói turn đã thay đổi gì, chạy gì, kết quả ra sao.",
    [["Giữ tập trung","Review bằng kết quả, chỉ mở quá trình khi có gì lạ."],["Cách làm","Gom tool_call theo file/lệnh; tính +/− từ diff; chèn trước câu trả lời cuối."],["Rủi ro","Không biết chắc message nào là câu trả lời cuối cho tới khi turn kết thúc."]]],
  object:["5 · Gom theo đối tượng","Panel Touched cạnh agent nhóm theo file và lệnh, không theo thời gian. Timeline chỉ có dòng mờ.",
    [["Giữ tập trung","Câu hỏi 'đã đụng vào gì' có câu trả lời cố định ở một chỗ."],["Cách làm","addWorkspacePanel đọc timeline của agent; trên mobile mở bằng pill Touched."],["Rủi ro","Panel chiếm chỗ trên màn hình hẹp; đường dẫn tương đối cần cwd của agent."]]],
  quiet:["6 · Im lặng trừ khi bất thường","Mọi thứ là dòng mờ và không tự mở. Chỉ lệnh lỗi hoặc chạy lâu mới tự mở và có cờ.",
    [["Giữ tập trung","Mắt chỉ bị kéo khi thật sự cần; nền cho bài 2 và bài 3."],["Cách làm","Như spec hiện tại, đổi chính sách mở: chỉ exception tự mở. Ngưỡng chạy lâu ở mockup là 4s, thật là ~30s."],["Rủi ro","Card 'chạy lâu' cần đồng hồ ở client; phase streaming không báo thời gian."]]],
  time:["7 · Thời gian đi đâu","Một thanh mảnh chia theo thời lượng từng hoạt động, đậm dần từ Explore tới Verify, đỏ khi lỗi.",
    [["Giữ tập trung","Một dải 8px; nhìn ra ngay agent kẹt ở đâu."],["Cách làm","Thời điểm bắt đầu/kết thúc lấy từ timestamp của item; gom như ý 3."],["Rủi ro","Timestamp item lịch sử có thể không có thời lượng chính xác; là thông tin phụ."]]],
  combo:["Ghép 1 + 2 + 4","Khi chạy: pill composer báo pha và việc hiện tại, timeline chỉ có dòng pha. Khi xong: dòng pha + khối Result trước câu trả lời cuối.",
    [["Giữ tập trung","Timeline chỉ còn câu trả lời và bản tóm tắt; trạng thái sống nằm ở composer."],["Cách làm","Pill composer + một dòng tóm tắt theo dõi timeline; tool/reasoning gốc ẩn sau Show steps."],["Rủi ro","Cộng dồn rủi ro của 1, 2 và 4; cần xác minh API timeline trong SDK plugin trước."]]],
};
function setItem(id,p){const it=get(id);const prev=it.status;Object.assign(it,p);
  if(p.status&&prev==="running"&&p.status!==prev){it.t1=S.clock;log(`<em>${esc(ACT[it.activity][0])} · ${esc(it.summary||firstLine(it.text)||"")}</em> → ${p.status}`);}}
function addLogStart(it){if(it.activity&&it.status==="running")log(`<em>${ACT[it.activity][0]}</em> started`);}
const steps=t=>t.filter(v=>v.activity&&v.activity!=="answer"&&v.activity!=="error");
const answers=t=>t.filter(v=>v.activity==="answer");
const errors=t=>t.filter(v=>v.activity==="error");
function segments(st){const out=[];for(const v of st){const p=PHASE[v.activity]||"explore";const last=out[out.length-1];
  if(last&&last.p===p){last.items.push(v)}else out.push({p,items:[v]})}
  return out.map(s=>({...s,status:s.items.some(v=>v.status==="running")?"running":s.items[s.items.length-1].status==="failed"?"failed":"done"}));}
function current(st){return [...st].reverse().find(v=>v.status==="running")}
function elapsed(v){return fmt(S.clock-v.t0)}
const parseDiff=m=>{const r=/\+(\d+)\s*−(\d+)/.exec(m||"");return r?[+r[1],+r[2]]:[0,0]};
function net(st){const files=new Map(),cmds=new Map(),looked=[];
  for(const v of st){if(v.activity==="edit"||v.activity==="write"||v.activity==="read"){const f=files.get(v.summary)||{path:v.summary,read:0,edit:0,add:0,del:0,live:false};
      if(v.activity==="read")f.read++;else{f.edit++;const [a,d]=parseDiff(v.meta);f.add+=a;f.del+=d}
      if(v.status==="running")f.live=true;files.set(v.summary,f)}
    else if(v.activity==="run"){const c=cmds.get(v.summary)||{cmd:v.summary,runs:[],live:false};c.runs.push(v);if(v.status==="running")c.live=true;cmds.set(v.summary,c)}
    else looked.push(v)}
  return {files:[...files.values()],cmds:[...cmds.values()],looked};}
const runIcon=r=>r.status==="running"?svg("loader-circle","spin"):svg(ST[r.status][0]);

function stepRow(v,open,extra=""){
  const [label,ic]=ACT[v.activity];
  return `<div class="card is-${v.status} ${extra}"><button class="hd steprow" data-id="${v.id}" ${aria(v,open)}><span class="ico">${svg(ic)}</span><span class="sum ${PROSE.has(v.activity)?"prose-sum":""}">${esc(v.summary)}</span><span class="meta">${esc(v.meta||"")}</span>${stIcon(v.status)}</button>${open?`<div class="stepbody">${bodyHtml(v)}</div>`:""}</div>`;
}
const isOpenC=(v,auto=false)=>v.manual??auto;
function exc(v){if(v.status==="failed")return {kind:"failed",text:`failed · ${v.meta||"error"}`};
  if(v.status==="running"&&S.clock-v.t0>LONG_MS)return {kind:"long",text:`still running after ${elapsed(v)}, longer than usual`};
  if(v.status==="canceled"&&v.t1-v.t0>30000)return {kind:"long",text:`canceled after ${dur(v)}`};return null}
function answerHtml(v){return `<div class="answerblk prose ${v.status==="running"?"caret":""}">${md(v.text||"")}</div>`}
function errHtml(v){return `<div class="errline">${svg("triangle-alert")}<span>${esc(v.summary)}</span></div>`}
function inOrder(t,stepFn){return t.map(v=>v.activity==="answer"?answerHtml(v):v.activity==="error"?errHtml(v):stepFn(v)).join("")}
function stepsToggle(key,st){const open=!!S.steps[key];
  return `<button class="toggle" data-steps="${key}" aria-expanded="${open}">${svg(open?"chevron-down":"chevron-right")}${open?"Hide":"Show"} ${st.length} step${st.length===1?"":"s"}</button>${open?`<div>${st.map(v=>stepRow(v,isOpenC(v))).join("")}</div>`:""}`}
function loopHtml(st){const segs=segments(st);if(!segs.length)return "";
  return `<div class="loop" aria-label="Phases">${segs.map((s,i)=>`${i?`<span class="arrow" aria-hidden="true">→</span>`:""}<span class="ph ${s.status}">${s.status==="running"?svg("loader-circle","spin"):`<span class="st">${svg(ST[s.status][0])}</span>`}${PH_LABEL[s.p]}${s.items.length>1?` <small>×${s.items.length}</small>`:""}</span>`).join("")}</div>`}
function nowHtml(st){const c=current(st);if(!c)return "";const [label,ic]=ACT[c.activity];
  return `<div class="now">${svg("loader-circle","spin")}<span>${label}</span><span class="sum ${PROSE.has(c.activity)?"prose-sum":""}">${esc(c.summary||"…")}</span><span>· ${elapsed(c)}</span></div>`}
function resultHtml(st){const n=net(st);
  const files=n.files.filter(f=>f.edit);const read=n.files.filter(f=>!f.edit);
  const rows=[];
  rows.push(["Changed",files.length?files.map(f=>`<span class="item"><span class="mono">${esc(f.path)}</span><span class="dim">+${f.add} −${f.del}${f.edit>1?` · ${f.edit} edits`:""}</span></span>`).join(""):`<span class="dim">No files changed</span>`]);
  if(n.cmds.length)rows.push(["Ran",n.cmds.map(c=>`<span class="item"><span class="mono">${esc(c.cmd)}</span>${c.runs.map(r=>`<span class="${r.status==="done"?"ok":r.status==="failed"?"bad":"dim"}" title="${esc(r.status)}">${runIcon(r)}</span>`).join("")}<span class="dim">${esc(c.runs[c.runs.length-1].meta||"")}</span></span>`).join("")]);
  const lookedBits=[];if(read.length)lookedBits.push(`${read.length} file${read.length>1?"s":""} read`);
  const cnt=a=>n.looked.filter(v=>v.activity===a).length;
  [["search","search"],["web","web page"],["delegate","sub-agent"],["tool","tool call"],["plan","plan"]].forEach(([a,w])=>{const k=cnt(a);if(k)lookedBits.push(`${k} ${w}${k>1?"s":""}`)});
  if(lookedBits.length)rows.push(["Looked at",`<span class="dim">${lookedBits.join(" · ")}</span>`]);
  return `<dl class="result">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`}

/* per-concept turn renderers; t = items of one turn (answers included), done = turn finished */
const R={
  phase(t,done,key){const st=steps(t);return `<div class="blk">${loopHtml(st)}${done?"":nowHtml(st)}<div>${stepsToggle(key,st)}</div></div>${errors(t).map(errHtml).join("")}${answers(t).map(answerHtml).join("")}`},
  composer(t){return inOrder(t,v=>stepRow(v,isOpenC(v)))},
  footprint(t,done,key){let html="",run=[];
    const flush=()=>{if(!run.length)return;const selId=S.sel[key];const sel=run.find(v=>v.id===selId);
      html+=`<div class="strip">${run.map(v=>`<button class="tile ${v.status} ${v.activity==="edit"?"edit":""} ${v.id===selId?"sel":""}" data-tile="${v.id}" data-key="${key}" aria-label="${esc(`${ACT[v.activity][0]} ${v.summary}, ${v.status}`)}" title="${esc(`${ACT[v.activity][0]} · ${v.summary}`)}">${svg(ACT[v.activity][1])}</button>`).join("")}</div>`;
      const c=current(run);html+=`<div class="cap">${c?`${ACT[c.activity][0]} · ${esc(c.summary||"…")} · ${elapsed(c)}`:`${run.length} step${run.length>1?"s":""}${run.some(v=>v.status==="failed")?` · ${run.filter(v=>v.status==="failed").length} failed`:""}`}</div>`;
      if(sel)html+=`<div class="tiledetail"><div class="hdr"><span class="ico">${svg(ACT[sel.activity][1])}</span><b>${ACT[sel.activity][0]}</b><span class="sum">${esc(sel.summary)}</span><span class="meta">${esc(sel.meta||"")}</span></div>${bodyHtml(sel)}</div>`;
      run=[]};
    for(const v of t){if(v.activity==="answer"||v.activity==="error"){flush();html+=v.activity==="answer"?answerHtml(v):errHtml(v)}else run.push(v)}
    flush();return html},
  result(t,done,key){const st=steps(t);const ans=answers(t);const fin=done?ans[ans.length-1]:null;
    return `${errors(t).map(errHtml).join("")}${ans.filter(a=>a!==fin).map(answerHtml).join("")}${done?resultHtml(st):`<div class="blk">${nowHtml(st)||`<div class="now">${svg("loader-circle","spin")}<span>Working</span></div>`}<span class="cap" style="margin:0">${st.length} step${st.length===1?"":"s"} so far</span></div>`}<div>${stepsToggle(key,st)}</div>${fin?answerHtml(fin):""}`},
  object(t){return inOrder(t,v=>stepRow(v,isOpenC(v)))},
  quiet(t){return inOrder(t,v=>{const e=exc(v);return stepRow(v,isOpenC(v,!!e),e?`exc ${e.kind}`:"")+(e?`<div class="flag ${e.kind==="long"?"warn":""}">${svg(e.kind==="long"?"triangle-alert":"x")}${esc(e.text)}</div>`:"")})},
  time(t){const st=steps(t);let tot=0;const segs=st.map(v=>{const d=Math.max(150,(v.t1??S.clock)-v.t0);tot+=d;return {v,d}});
    const by={};segs.forEach(({v,d})=>{const k=v.activity==="think"?"think":PHASE[v.activity]||"explore";by[k]=(by[k]||0)+d});
    const lbl={think:"Think",explore:"Explore",change:"Change",verify:"Verify"};
    return `<div class="tbar" role="img" aria-label="Time per activity">${segs.map(({v,d})=>`<span class="${v.status==="running"?"running":v.status==="failed"?"failed":v.activity==="think"?"think":PHASE[v.activity]||"explore"}" style="flex:${d}" title="${esc(`${ACT[v.activity][0]} · ${v.summary} · ${(d/1000).toFixed(1)}s`)}"></span>`).join("")}</div>
      <div class="tlegend">${Object.entries(by).map(([k,d])=>`<span><i class="tbar-${k}" style="background:${k==="think"?"color-mix(in srgb,var(--fg) 12%,transparent)":k==="explore"?"color-mix(in srgb,var(--fg) 22%,transparent)":k==="change"?"color-mix(in srgb,var(--fg) 50%,transparent)":"color-mix(in srgb,var(--fg) 75%,transparent)"}"></i>${lbl[k]} ${(d/1000).toFixed(1)}s</span>`).join("")}</div>${inOrder(t,v=>stepRow(v,isOpenC(v)))}`},
  combo(t,done,key){const st=steps(t);const ans=answers(t);const fin=done?ans[ans.length-1]:null;
    return `${errors(t).map(errHtml).join("")}${ans.filter(a=>a!==fin).map(answerHtml).join("")}<div class="blk">${loopHtml(st)}</div>${done?resultHtml(st):""}<div>${stepsToggle(key,st)}</div>${fin?answerHtml(fin):""}`},
};

function composerPills(lastTurn){
  const usage=`<span class="cpill">Claude 12%/40%</span><span class="cpill">Ctx 31%</span>`;
  if(!["composer","combo","object"].includes(S.concept)||S.plugin==="off")return usage;
  const st=steps(lastTurn.items);const c=current(st);
  if(S.concept==="object"){const n=net(st);const k=n.files.length+n.cmds.length;
    return `${usage}<span class="cpill ${k?"":"dim"}"><button data-sheet="1" aria-expanded="${S.sheet}">${svg("list-checks")} Touched · ${k}</button></span>`}
  if(c){const seg=segments(st).find(s=>s.status==="running");
    return `${usage}<span class="cpill live">${svg("loader-circle","spin")}${S.concept==="combo"?`<b style="font-weight:600">${PH_LABEL[seg.p]}</b> ·`:""}<span>${ACT[c.activity][0]}</span><span class="sum ${PROSE.has(c.activity)?"prose-sum":""}">${esc(c.summary||"…")}</span><span>${elapsed(c)}</span></span>`}
  const failedNow=st.length&&st[st.length-1].status==="failed";
  return `${usage}<span class="cpill ${failedNow?"bad":""}">${svg(lastTurn.done?"check":"loader-circle",lastTurn.done?"":"spin")}${lastTurn.done?`Idle · last turn ${st.length} steps`:"Thinking…"}</span>`}
function objectPanel(lastTurn){const n=net(steps(lastTurn.items));
  const ops=f=>[f.read?`read${f.read>1?` ×${f.read}`:""}`:"",f.edit?`edit${f.edit>1?` ×${f.edit}`:""}`:""].filter(Boolean).join(" · ");
  const files=n.files.map(f=>`<div class="obj ${f.live?"live":""}"><span class="sum">${esc(f.path)}</span><span class="meta">${f.edit?`+${f.add} −${f.del}`:""}</span><span class="ops">${f.live?svg("loader-circle","spin"):""}${ops(f)}</span></div>`).join("")||`<div class="dim" style="font-size:12px">None yet</div>`;
  const cmds=n.cmds.map(c=>`<div class="obj ${c.live?"live":""}"><span class="sum">${esc(c.cmd)}</span><span class="meta">${esc(c.runs[c.runs.length-1].meta||"")}</span><span class="ops">${c.runs.map(r=>`<span class="${r.status==="done"?"ok":r.status==="failed"?"bad":""}">${runIcon(r)}</span>`).join(" ")}</span></div>`).join("")||`<div class="dim" style="font-size:12px">None yet</div>`;
  const other=n.looked.filter(v=>v.activity!=="think").map(v=>`<div class="obj ${v.status==="running"?"live":""}"><span class="sum ${PROSE.has(v.activity)?"prose-sum":""}">${esc(v.summary||"…")}</span><span class="meta">${esc(v.meta||"")}</span><span class="ops">${svg(ACT[v.activity][1])}${ACT[v.activity][0]}</span></div>`).join("");
  return `<h3>Touched this turn</h3><div class="sec"><span class="lbl">Files</span>${files}</div><div class="sec"><span class="lbl">Commands</span>${cmds}</div>${other?`<div class="sec"><span class="lbl">Looked up</span>${other}</div>`:""}`}

function render(){
  const frame=document.getElementById("frame");
  document.body.className="t-"+S.theme;
  frame.className=`frame ${S.layout==="compact"?"compact":""} c-${S.plugin==="off"?"off":S.concept} s-off`;
  document.getElementById("prov").textContent=PROV[S.provider];
  const turns=[];let cur=null;
  for(const x of [...HIST,...S.items]){
    if(x.kind==="user"){cur={user:x.text,base:x.t0??0,items:[],done:false,end:""};turns.push(cur);continue}
    if(x.kind==="end"){cur.done=true;cur.end=x.text;continue}
    const v=view(x);v.base=cur.base;cur.items.push(v);
  }
  let html="";
  turns.forEach((t,i)=>{const key="t"+i;html+=`<div class="user"><div>${esc(t.user)}</div></div>`;
    html+=S.plugin==="off"?t.items.map(rOff).join(""):R[S.concept](t.items,t.done,key);
    if(t.done)html+=`<div class="turnend">${esc(t.end)}</div>`;});
  const tl=document.getElementById("tl");const atBottom=tl.scrollHeight-tl.scrollTop-tl.clientHeight<60;
  document.getElementById("tlin").innerHTML=html;
  if(S.playing||atBottom)tl.scrollTop=tl.scrollHeight;
  const last=turns[turns.length-1];
  document.getElementById("pills").innerHTML=composerPills(last);
  document.getElementById("objpanel").innerHTML=S.concept==="object"?objectPanel(last):"";
  document.getElementById("sheet").innerHTML=S.concept==="object"&&S.sheet&&S.layout==="compact"&&S.plugin==="on"?`<div class="objsheet objpanel" style="display:block;width:auto;border-left:1px solid var(--border)">${objectPanel(last)}</div>`:"";
  document.getElementById("clock").textContent=fmt(S.clock);
  const [n,d,f]=CONCEPTS[S.concept];
  document.getElementById("optname").textContent=S.plugin==="off"?"Plugin off · Paseo default (approximation)":n;
  document.getElementById("optdesc").textContent=S.plugin==="off"?"Plugin tắt thì Paseo vẽ lại hàng tool mặc định.":d;
  document.getElementById("feas").innerHTML=S.plugin==="off"?"":f.map(([k,v])=>`<div><b>${k}</b>${esc(v)}</div>`).join("");
  document.getElementById("log").innerHTML=S.log.map(e=>`<div><span>${fmt(e.t)}</span><span>${e.html}</span></div>`).join("")||`<div><span></span><span>Bấm Play để chạy một turn mới dưới turn đã xong.</span></div>`;
  document.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(String(S[seg.dataset.key]??"")===b.dataset.v))));
  document.getElementById("play").innerHTML=S.playing?`${svg("pause")}Pause`:`${svg("play")}${S.ci>=SCRIPT.length?"Replay":"Play"}`;
}

/* ---------- clock + events ---------- */
function runUntil(t){while(S.ci<SCRIPT.length&&SCRIPT[S.ci].t<=t){const e=SCRIPT[S.ci++];S.clock=e.t;const before=S.items.length;e.fn();if(S.items.length>before)addLogStart(S.items[S.items.length-1]);}
  S.clock=Math.min(t,SCRIPT.length?SCRIPT[SCRIPT.length-1].t:t);}
function reset(){S.items=[];S.log=[];S.clock=0;S.ci=0;S.playing=false;S.steps={};S.sel={};HIST.forEach(h=>delete h.manual);SCRIPT=buildScript();}
let lastTs=0;function tick(ts){if(S.playing){const dt=lastTs?Math.min(100,ts-lastTs):0;runUntil(S.clock+dt*Number(S.speed));render();}lastTs=ts;requestAnimationFrame(tick);}
document.querySelectorAll("[data-icon]").forEach(b=>b.insertAdjacentHTML("afterbegin",svg(b.dataset.icon)));
document.querySelectorAll(".seg").forEach(seg=>seg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S[seg.dataset.key]=b.dataset.v;render();}));
document.getElementById("frame").addEventListener("click",e=>{
  const st=e.target.closest("[data-steps]");if(st){S.steps[st.dataset.steps]=!S.steps[st.dataset.steps];render();return}
  const tile=e.target.closest("[data-tile]");if(tile){const k=tile.dataset.key;S.sel[k]=S.sel[k]===tile.dataset.tile?null:tile.dataset.tile;render();return}
  if(e.target.closest("[data-sheet]")){S.sheet=!S.sheet;render();return}
  const b=e.target.closest("button.hd[data-id]");if(!b)return;const it=get(b.dataset.id)||HIST.find(x=>x.id===b.dataset.id);
  it.manual=!(b.getAttribute("aria-expanded")==="true");render();});
document.getElementById("play").onclick=()=>{if(S.ci>=SCRIPT.length)reset();S.playing=!S.playing;lastTs=0;render();};
document.getElementById("step").onclick=()=>{S.playing=false;const sig=()=>S.items.map(x=>x.id+x.status).join();const a=sig();while(S.ci<SCRIPT.length&&sig()===a)runUntil(SCRIPT[S.ci].t);render();};
document.getElementById("end").onclick=()=>{S.playing=false;runUntil(1e9);render();};
document.getElementById("reset").onclick=()=>{reset();render();};
reset();render();requestAnimationFrame(tick);

</script>
</body>
</html>
