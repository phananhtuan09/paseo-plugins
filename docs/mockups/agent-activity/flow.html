<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-activity · flow</title>
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
/* Paseo default theme, limited to the 11 PluginTheme.colors tokens a plugin receives.
   --s3/--xmuted/--run are aliases of those tokens, never extra colors. */
.t-light,.t-dark{--s3:var(--border);--xmuted:var(--muted);--run:var(--accent)}
.t-light{--s0:#ffffff;--s1:#fafafa;--s2:#f4f4f5;--fg:#1a1a1e;--muted:#71717a;--border:#e4e4e7;--accent:#20744A;--ok:#3e704a;--bad:#9d433b;--warn:#7b5d39;--sidebar:#f4f4f5;--sel:#20744A33}
.t-dark{--s0:#181B1A;--s1:#1E2120;--s2:#272A29;--fg:#fafafa;--muted:#A1A5A4;--border:#252B2A;--accent:#20744A;--ok:#6cb17b;--bad:#d8847b;--warn:#c09664;--sidebar:#141716;--sel:#20744A66}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:var(--sidebar);color:var(--fg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke-width:1.75;display:block}
.ico{display:inline-flex;align-items:center}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.pulse::after{animation:none!important}}

/* ---------- mockup chrome ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--s0)}
.bar h1{font-size:13px;font-weight:600;margin:0 6px 0 0;white-space:nowrap}
.bar h1 span{color:var(--muted);font-weight:400}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--s2);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--s0);color:var(--fg);box-shadow:0 1px 2px #0000001f}
.btn{border:1px solid var(--border);background:var(--s0);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--s1)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.clock{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.canvas{display:flex;justify-content:center;padding:20px;min-height:0;overflow:hidden}
.side{border-left:1px solid var(--border);background:var(--s0);display:flex;flex-direction:column;min-height:0}
.side section{padding:14px 16px;border-bottom:1px solid var(--border)}
.side h2{font-size:12px;font-weight:600;margin:0 0 8px;color:var(--fg)}
.side p{margin:0;color:var(--muted);font-size:12.5px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rules li{font-size:12.5px;padding:4px 8px;border-radius:6px;color:var(--muted);transition:background .4s,color .4s}
.rules li b{color:var(--fg);font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
.rules li.hit{background:var(--s2);color:var(--fg)}
.log{flex:1;overflow:auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:6px}
.log div{font-size:12px;color:var(--muted);display:grid;grid-template-columns:40px 1fr;gap:6px}
.log div span:first-child{font-family:var(--mono);color:var(--xmuted);font-variant-numeric:tabular-nums}
.log div em{font-style:normal;color:var(--fg)}

/* ---------- Paseo frame ---------- */
.frame{width:min(920px,100%);height:100%;background:var(--s0);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 24px -12px #0000002e}
.frame.compact{width:390px}
.fhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.fhead .title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead .prov{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tl{flex:1;overflow:auto;padding:18px 0 28px}
.tl-inner{max-width:760px;margin:0 auto;padding:0 20px}
.compact .tl-inner{padding:0 12px}
.user{display:flex;justify-content:flex-end;margin:22px 0 14px}
.user:first-child{margin-top:0}
.user div{background:var(--s2);border-radius:14px;padding:8px 12px;max-width:80%}
.turnend{font-size:12px;color:var(--xmuted);margin:10px 0 0}
.composer{border-top:1px solid var(--border);padding:10px 14px}
.composer>div:last-child{border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--xmuted);font-size:13.5px}

/* shared card atoms */
.sum.prose-sum{font-family:var(--ui);font-size:13px}
.sum{font-family:var(--mono);font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--muted)}
.st{display:inline-flex;color:var(--xmuted)}
.st svg.i{width:14px;height:14px}
.is-running .st,.is-running .ico{color:var(--fg)}
.is-failed .st,.is-failed .ico{color:var(--bad)}
.is-failed .sum,.is-failed .meta{color:var(--bad)}
.is-done .st{color:var(--ok)}
.is-canceled .sum{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--xmuted)}
.is-canceled .st{color:var(--muted)}
.hd{all:unset;box-sizing:border-box;cursor:pointer}
.hd.static{cursor:default}
.body{font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--fg);white-space:pre;overflow-x:auto;margin:0}
.body .add{color:var(--ok)}.body .del{color:var(--bad)}.body .hunk{color:var(--muted)}
.more{font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:4px}
.details{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-bottom:8px}
.details dt{color:var(--muted)}.details dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.errtext{font-family:var(--mono);font-size:12px;color:var(--bad);margin-top:8px;white-space:pre-wrap}
.prose{font-size:14px;line-height:1.6;color:var(--fg)}
.prose p{margin:0 0 8px}.prose p:last-child{margin:0}
.prose ul{margin:0 0 8px;padding-left:18px}
.prose code{font-family:var(--mono);font-size:12.5px;background:var(--s2);padding:1px 4px;border-radius:4px}
.thinking{font-size:13px;line-height:1.55;color:var(--muted);white-space:pre-wrap}
.caret::after{content:"";display:inline-block;width:6px;height:13px;margin-left:2px;vertical-align:-2px;background:var(--run);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ========== Plugin off · approximated Paseo default ========== */
.s-off .drow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:4px 0}
.s-off .drow b{font-weight:500;color:var(--fg)}
.s-off .drow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-off .dans{margin:8px 0}
.s-off .derr{color:var(--bad);font-size:13px;margin:6px 0}

/* ========== flow ========== */
.dim{color:var(--muted)}
.answerblk{margin:10px 0}
.errline{display:flex;gap:8px;align-items:flex-start;color:var(--bad);font-size:13px;margin:6px 0}
.stepbody{margin:2px 0 8px 24px;padding:8px 10px;background:var(--s1);border:1px solid var(--border);border-radius:6px}
.toggle{all:unset;cursor:pointer;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:2px 6px;margin-left:-6px;border-radius:6px}
.toggle:hover{background:var(--s2);color:var(--fg)}
.toggle svg.i{width:14px;height:14px}
.chap{margin:6px 0 8px}

/* Brief: one wrapping line per run of steps, in place */
.chapline{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px;align-items:start;width:calc(100% + 12px);padding:4px 6px;margin-left:-6px;border-radius:8px}
.chapline:hover{background:var(--s1)}
.chapline>svg.i{margin-top:3px;width:14px;height:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12.5px;line-height:22px;min-width:0}
.phw{font-size:11.5px;font-weight:600;color:var(--muted);margin-right:-6px}
.phw.running{color:var(--fg)}.phw.failed{color:var(--bad)}
.phsep{display:inline-flex;color:var(--muted);margin:0 -6px}
.phsep svg.i{width:12px;height:12px}
.chip{display:inline-flex;align-items:center;gap:5px;color:var(--muted);min-width:0;max-width:100%;border-radius:6px}
.chip svg.i{width:14px;height:14px}
.chip .vb{color:var(--fg);font-weight:500;white-space:nowrap}
.chip .tg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30ch;min-width:0}
.chip .tg.mono{font-family:var(--mono);font-size:12px}
.chip .mt{font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.s-running{color:var(--fg);padding:0 7px;margin:0 -1px;background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 50%,transparent)}
.chip.s-failed,.chip.s-failed .vb{color:var(--bad)}
.chip.s-canceled .tg{text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .ok{color:var(--ok);display:inline-flex}

/* Steps / Full: one row per step, verb in its own column */
.phdiv{font-size:11.5px;font-weight:600;color:var(--muted);margin:8px 0 2px;display:flex;align-items:center;gap:6px}
.phdiv.running{color:var(--fg)}.phdiv.failed{color:var(--bad)}
.row{display:grid;grid-template-columns:16px 78px minmax(0,1fr) auto 14px;gap:8px;align-items:center;width:calc(100% + 12px);min-height:28px;padding:0 6px;margin-left:-6px;border-radius:6px}
.compact .row{grid-template-columns:16px 66px minmax(0,1fr) auto 14px;gap:6px}
.row:hover{background:var(--s1)}
.row .ico{color:var(--muted)}
.row svg.i{width:14px;height:14px}
.row .vb{font-size:12.5px;font-weight:500;color:var(--fg);white-space:nowrap}
.row .tg{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .tg.mono{font-family:var(--mono)}
.row .meta{font-size:11.5px}
.row.s-running{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.row.s-running .ico,.row.s-running .tg{color:var(--fg)}
.row.s-failed .vb,.row.s-failed .tg,.row.s-failed .meta,.row.s-failed .ico{color:var(--bad)}
.row.s-canceled .tg{text-decoration:line-through;text-decoration-color:var(--muted)}

/* composer track */
.track{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cpill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted);max-width:100%;min-width:0;background:transparent}
button.cpill{cursor:pointer}
button.cpill:hover{background:var(--s1);color:var(--fg)}
.cpill svg.i{width:13px;height:13px}
.cpill .vb{color:var(--fg);font-weight:500;white-space:nowrap}
.cpill .tg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cpill .tg.mono{font-family:var(--mono);font-size:11.5px}
.cpill .mt{font-variant-numeric:tabular-nums}
.cpill.live{color:var(--fg);border-color:var(--accent)}
.cpill.bad{color:var(--bad)}
.cpill.follow{flex:1 1 220px;max-width:420px}
.compact .cpill.follow{flex-basis:100%;max-width:none}

/* Jump-to-live highlight */
.flash{animation:flash 1.4s cubic-bezier(.16,1,.3,1)}
@keyframes flash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

.side .feas{display:grid;gap:8px}
.side .feas div{font-size:12.5px;color:var(--muted)}
.side .feas b{color:var(--fg);font-weight:600;display:block;margin-bottom:1px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <h1>agent-activity <span>flow</span></h1>
    <div class="grp"><label>Detail</label><div class="seg" data-key="level"><button data-v="brief">Brief</button><button data-v="steps">Steps</button><button data-v="full">Full</button></div></div>
    <div class="grp"><label>Plugin</label><div class="seg" data-key="plugin"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="grp"><label>Provider</label><div class="seg" data-key="provider"><button data-v="claude">Claude Code</button><button data-v="codex">Codex</button><button data-v="omp">OMP</button></div></div>
    <div class="grp"><label>Theme</label><div class="seg" data-key="theme"><button data-v="light" aria-label="Light theme" data-icon="sun"></button><button data-v="dark" aria-label="Dark theme" data-icon="moon"></button></div></div>
    <div class="grp"><label>Layout</label><div class="seg" data-key="layout"><button data-v="desktop" aria-label="Desktop" data-icon="monitor"></button><button data-v="compact" aria-label="Compact" data-icon="smartphone"></button></div></div>
    <div class="grp">
      <button class="btn primary" id="play"></button>
      <button class="btn" id="step" data-icon="skip-forward">Step</button>
      <button class="btn" id="end">Finish turn</button>
      <button class="btn" id="reset" data-icon="rotate-ccw">Reset</button>
      <div class="seg" data-key="speed"><button data-v="0.5">0.5×</button><button data-v="1">1×</button><button data-v="2">2×</button></div>
      <span class="clock" id="clock">0:00</span>
    </div>
  </header>
  <div class="stage">
    <div class="canvas">
      <div class="frame" id="frame">
        <div class="fhead"><span class="title">Fix UTC date formatter</span><span class="prov" id="prov"></span></div>
        <div class="tl" id="tl"><div class="tl-inner" id="tlin"></div></div>
        <div class="composer"><div class="track" id="pills"></div><div>Message the agent…</div></div>
      </div>
    </div>
    <aside class="side">
      <section><h2 id="optname"></h2><p id="optdesc"></p></section>
      <section><h2>Đáp ứng góp ý</h2><div class="feas" id="fixes"></div></section>
      <section><h2>Đánh giá</h2><div class="feas" id="feas"></div></section>
      <section style="border-bottom:0;padding-bottom:0"><h2>What just happened</h2></section>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>
<script>
const ICONS = {"bot": "<path d=\"M12 8V4H8\" /> <rect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\" /> <path d=\"M2 14h2\" /> <path d=\"M20 14h2\" /> <path d=\"M15 13v2\" /> <path d=\"M9 13v2\" />", "brain": "<path d=\"M12 18V5\" /> <path d=\"M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4\" /> <path d=\"M17.707 6.294A3 3 0 1012 5a3 3 0 10-5.707 1.294\" /> <path d=\"M17.996 5.125a4 4 0 012.526 5.77\" /> <path d=\"M18 18a4 4 0 002-7.465\" /> <path d=\"M19.967 17.482a4 4 0 11-7.967.517 4 4 0 11-7.967-.517\" /> <path d=\"M6 18a4 4 0 01-2-7.465\" /> <path d=\"M6.004 5.125a4 4 0 00-2.526 5.77\" />", "check": "<path d=\"M20 6 9 17l-5-5\" />", "chevron-down": "<path d=\"m6 9 6 6 6-6\" />", "chevron-right": "<path d=\"m9 18 6-6-6-6\" />", "circle-slash": "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <line x1=\"9\" x2=\"15\" y1=\"15\" y2=\"9\" />", "file-pen": "<path d=\"M12.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v9.34\" /> <path d=\"M14 2v5a1 1 0 0 0 1 1h5\" /> <path d=\"M10.378 12.622a1 1 0 0 1 3 3.003L8.36 20.637a2 2 0 0 1-.854.506l-2.867.837a.5.5 0 0 1-.62-.62l.836-2.869a2 2 0 0 1 .506-.853z\" />", "file-plus": "<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\" /> <path d=\"M14 2v5a1 1 0 0 0 1 1h5\" /> <path d=\"M9 15h6\" /> <path d=\"M12 18v-6\" />", "file-text": "<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\" /> <path d=\"M14 2v5a1 1 0 0 0 1 1h5\" /> <path d=\"M10 9H8\" /> <path d=\"M16 13H8\" /> <path d=\"M16 17H8\" />", "globe": "<circle cx=\"12\" cy=\"12\" r=\"10\" /> <path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20\" /> <path d=\"M2 12h20\" />", "list-checks": "<path d=\"M13 5h8\" /> <path d=\"M13 12h8\" /> <path d=\"M13 19h8\" /> <path d=\"m3 17 2 2 4-4\" /> <path d=\"m3 7 2 2 4-4\" />", "loader-circle": "<path d=\"M21 12a9 9 0 1 1-6.219-8.56\" />", "message-square": "<path d=\"M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z\" />", "monitor": "<rect width=\"20\" height=\"14\" x=\"2\" y=\"3\" rx=\"2\" /> <line x1=\"8\" x2=\"16\" y1=\"21\" y2=\"21\" /> <line x1=\"12\" x2=\"12\" y1=\"17\" y2=\"21\" />", "moon": "<path d=\"M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401\" />", "pause": "<rect x=\"14\" y=\"3\" width=\"5\" height=\"18\" rx=\"1\" /> <rect x=\"5\" y=\"3\" width=\"5\" height=\"18\" rx=\"1\" />", "play": "<path d=\"M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z\" />", "power": "<path d=\"M12 2v10\" /> <path d=\"M18.4 6.6a9 9 0 1 1-12.77.04\" />", "rotate-ccw": "<path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\" /> <path d=\"M3 3v5h5\" />", "search": "<path d=\"m21 21-4.34-4.34\" /> <circle cx=\"11\" cy=\"11\" r=\"8\" />", "skip-forward": "<path d=\"M21 4v16\" /> <path d=\"M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z\" />", "smartphone": "<rect width=\"14\" height=\"20\" x=\"5\" y=\"2\" rx=\"2\" ry=\"2\" /> <path d=\"M12 18h.01\" />", "square-terminal": "<path d=\"m7 11 2-2-2-2\" /> <path d=\"M11 13h4\" /> <rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" ry=\"2\" />", "sun": "<circle cx=\"12\" cy=\"12\" r=\"4\" /> <path d=\"M12 2v2\" /> <path d=\"M12 20v2\" /> <path d=\"m4.93 4.93 1.41 1.41\" /> <path d=\"m17.66 17.66 1.41 1.41\" /> <path d=\"M2 12h2\" /> <path d=\"M20 12h2\" /> <path d=\"m6.34 17.66-1.41 1.41\" /> <path d=\"m19.07 4.93-1.41 1.41\" />", "triangle-alert": "<path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\" /> <path d=\"M12 9v4\" /> <path d=\"M12 17h.01\" />", "wrench": "<path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z\" />", "x": "<path d=\"M18 6 6 18\" /> <path d=\"m6 6 12 12\" />"};

function errHtml(v){return `<div class="errline">${svg("triangle-alert")}<span>${esc(v.summary)}</span></div>`}
function renderTurn(t,key){let html="",run=[],ri=0;
  const flush=()=>{if(run.length)html+=chapter(run,`${key}c${ri++}`);run=[]};
  for(const v of t){if(v.activity==="answer"){flush();html+=answerHtml(v)}else if(v.activity==="error"){flush();html+=errHtml(v)}else run.push(v)}
  flush();return html}

function followPill(turn){
  const st=turn.items.filter(v=>v.activity&&v.activity!=="error");const c=[...st].reverse().find(v=>v.status==="running");
  const steps=st.filter(v=>v.activity!=="answer");
  if(c){const ph=c.activity==="answer"?"":PH_LABEL[PHASE[c.activity]];const tg=target(c);
    return `<button class="cpill follow live" data-follow aria-label="${esc(`${verb(c.activity,"running")} ${tg}. Jump to it`)}"><span class="ico">${svg(ACT[c.activity][1])}</span>${ph?`<span>${ph} ·</span>`:""}<span class="vb">${verb(c.activity,"running")}</span>${tg?`<span class="tg ${tgtClass(c.activity)}">${esc(tg)}</span>`:""}<span class="mt">${elapsed(c)}</span>${svg("loader-circle","spin")}</button>`}
  if(!turn.done)return `<span class="cpill follow live">${svg("loader-circle","spin")}<span class="vb">Working</span></span>`;
  const failed=steps.filter(v=>v.status==="failed").length;
  return `<span class="cpill follow">${svg("check")}<span class="vb">Done</span><span>${steps.length} steps${failed?` · ${failed} failed`:""} · ${esc(turn.end.replace(/^Turn finished · /,""))}</span></span>`}

const PANEL={
  name:"Dòng chảy · Flow",
  desc:"Các bước nằm đúng chỗ chúng xảy ra trong timeline. Mỗi bước luôn có icon và nhãn hành động. Bạn chọn mức chi tiết một lần cho mọi turn, và pill ở composer luôn nói agent đang làm gì.",
  fixes:[["Pha không bị đẩy lên đầu","Mỗi đoạn bước giữa hai câu trả lời là một dòng riêng, nằm đúng vị trí thời gian; câu trả lời dài không che pha của đoạn sau."],
    ["Icon + nhãn luôn hiện","Thinking, Reading, Running… ở mọi mức chi tiết; đang chạy dùng thì hiện tại, xong dùng quá khứ."],
    ["Xem chi tiết không phải mở từng bước","Pill Detail đổi Brief → Steps → Full cho cả timeline; bấm một dòng chỉ mở đoạn đó."],
    ["Luôn biết agent đang làm gì","Pill composer luôn hiện việc đang chạy, kể cả khi bạn cuộn lên đọc; bấm để nhảy tới nó."]],
  feas:[["Cách làm","Steps/Full: transformer + renderer theo từng item, không phụ thuộc gì thêm. Brief: renderer của item đầu đoạn vẽ cả dòng, các item sau vẽ rỗng. Pill: addComposerPill. Mức chi tiết: một store dùng chung trong plugin."],
    ["Đã kiểm","SDK client có agents.ref(id).timeline.subscribe() và refetch(); usePaseo() trả về đúng API đó (đọc từ types, chưa chạy thử)."],
    ["Rủi ro","Item rỗng có thể vẫn chiếm khoảng cách giữa các item của timeline; phải đo trên E2E. Phân pha theo loại tool là ước lượng: lệnh không phải test vẫn tính là Verify."]]};

function render(){
  const frame=document.getElementById("frame");
  document.body.className="t-"+S.theme;
  frame.className=`frame ${S.layout==="compact"?"compact":""} ${S.plugin==="off"?"s-off":""}`;
  document.getElementById("prov").textContent=PROV[S.provider];
  const turns=[];let cur=null;
  for(const x of [...HIST,...S.items]){
    if(x.kind==="user"){cur={user:x.text,items:[],done:false,end:""};turns.push(cur);continue}
    if(x.kind==="end"){cur.done=true;cur.end=x.text;continue}
    cur.items.push(view(x));
  }
  let html="";
  turns.forEach((t,i)=>{html+=`<div class="user"><div>${esc(t.user)}</div></div>`;
    html+=S.plugin==="off"?t.items.map(rOff).join(""):renderTurn(t.items,"t"+i);
    if(t.done)html+=`<div class="turnend">${esc(t.end)}</div>`;});
  const tl=document.getElementById("tl");const atBottom=tl.scrollHeight-tl.scrollTop-tl.clientHeight<60;
  document.getElementById("tlin").innerHTML=html;
  if(atBottom)tl.scrollTop=tl.scrollHeight;
  if(S.flashId){const el=tl.querySelector(`[data-live="${S.flashId}"]`);if(el){const r=el.getBoundingClientRect(),tr=tl.getBoundingClientRect();tl.scrollTop+=r.top-tr.top-tl.clientHeight/2+r.height/2;el.classList.add("flash")}S.flashId=null}
  const usage=`<span class="cpill">Claude 12%/40%</span><span class="cpill">Ctx 31%</span>`;
  document.getElementById("pills").innerHTML=S.plugin==="off"?usage:`${followPill(turns[turns.length-1])}<button class="cpill" data-level aria-label="Detail level ${LEVEL_LABEL[S.level]}. Change">${svg("list-checks")}Detail · <span class="vb">${LEVEL_LABEL[S.level]}</span></button>${usage}`;
  document.getElementById("clock").textContent=fmt(S.clock);
  document.getElementById("optname").textContent=S.plugin==="off"?"Plugin off · Paseo default (approximation)":PANEL.name;
  document.getElementById("optdesc").textContent=S.plugin==="off"?"Plugin tắt thì Paseo vẽ lại hàng tool mặc định.":PANEL.desc;
  document.getElementById("fixes").innerHTML=PANEL.fixes.map(([k,v])=>`<div><b>${k}</b>${esc(v)}</div>`).join("");
  document.getElementById("feas").innerHTML=PANEL.feas.map(([k,v])=>`<div><b>${k}</b>${esc(v)}</div>`).join("");
  document.getElementById("log").innerHTML=S.log.map(e=>`<div><span>${fmt(e.t)}</span><span>${e.html}</span></div>`).join("")||`<div><span></span><span>Bấm Play để chạy một turn mới. Cuộn lên đọc turn cũ trong lúc chạy, rồi bấm pill đang chạy ở composer để quay lại.</span></div>`;
  document.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(String(S[seg.dataset.key]??"")===b.dataset.v))));
  document.getElementById("play").innerHTML=S.playing?`${svg("pause")}Pause`:`${svg("play")}${S.ci>=SCRIPT.length?"Replay":"Play"}`;
}

/* ---------- clock + events ---------- */
function runUntil(t){while(S.ci<SCRIPT.length&&SCRIPT[S.ci].t<=t){const e=SCRIPT[S.ci++];S.clock=e.t;const before=S.items.length;e.fn();if(S.items.length>before)addLogStart(S.items[S.items.length-1]);}
  S.clock=Math.min(t,SCRIPT.length?SCRIPT[SCRIPT.length-1].t:t);}
function reset(){S.items=[];S.log=[];S.clock=0;S.ci=0;S.playing=false;S.chap={};HIST.forEach(h=>delete h.manual);SCRIPT=buildScript();}
let lastTs=0;function tick(ts){if(S.playing){const dt=lastTs?Math.min(100,ts-lastTs):0;runUntil(S.clock+dt*Number(S.speed));render();}lastTs=ts;requestAnimationFrame(tick);}
document.querySelectorAll("[data-icon]").forEach(b=>b.insertAdjacentHTML("afterbegin",svg(b.dataset.icon)));
document.querySelectorAll(".seg").forEach(seg=>seg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S[seg.dataset.key]=b.dataset.v;if(seg.dataset.key==="level"){S.chap={};[...HIST,...S.items].forEach(x=>delete x.manual)}render();}));
document.getElementById("frame").addEventListener("click",e=>{
  if(e.target.closest("[data-level]")){S.level=NEXT_LEVEL[S.level];S.chap={};[...HIST,...S.items].forEach(x=>delete x.manual);log(`Detail level → <em>${LEVEL_LABEL[S.level]}</em> for every turn`);render();return}
  const f=e.target.closest("[data-follow]");if(f){const c=[...S.items].reverse().find(x=>x.status==="running");if(c){S.flashId=c.id;log(`Jumped to <em>${verb(c.activity,"running")}</em>`)}render();return}
  const ch=e.target.closest("[data-chap]");if(ch){const k=ch.dataset.chap;const cur=S.chap[k]??S.level;S.chap[k]=cur==="brief"?(S.level==="brief"?"steps":S.level):"brief";render();return}
  const b=e.target.closest("button.hd[data-id]");if(!b)return;const it=get(b.dataset.id)||HIST.find(x=>x.id===b.dataset.id);
  it.manual=!(b.getAttribute("aria-expanded")==="true");render();});
document.getElementById("play").onclick=()=>{if(S.ci>=SCRIPT.length)reset();S.playing=!S.playing;lastTs=0;render();};
document.getElementById("step").onclick=()=>{S.playing=false;const sig=()=>S.items.map(x=>x.id+x.status).join();const a=sig();while(S.ci<SCRIPT.length&&sig()===a)runUntil(SCRIPT[S.ci].t);render();};
document.getElementById("end").onclick=()=>{S.playing=false;runUntil(1e9);render();};
document.getElementById("reset").onclick=()=>{reset();render();};
reset();render();requestAnimationFrame(tick);

</script>
</body>
