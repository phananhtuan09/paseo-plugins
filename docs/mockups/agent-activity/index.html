<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-activity · timeline card mockup</title>
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
/* Paseo default theme, limited to the 11 PluginTheme.colors tokens a plugin receives.
   --s3/--xmuted/--run are aliases of those tokens, never extra colors. */
.t-light,.t-dark{--s3:var(--border);--xmuted:var(--muted);--run:var(--accent)}
.t-light{--s0:#ffffff;--s1:#fafafa;--s2:#f4f4f5;--fg:#1a1a1e;--muted:#71717a;--border:#e4e4e7;--accent:#20744A;--ok:#3e704a;--bad:#9d433b;--warn:#7b5d39;--sidebar:#f4f4f5;--sel:#20744A33}
.t-dark{--s0:#181B1A;--s1:#1E2120;--s2:#272A29;--fg:#fafafa;--muted:#A1A5A4;--border:#252B2A;--accent:#20744A;--ok:#6cb17b;--bad:#d8847b;--warn:#c09664;--sidebar:#141716;--sel:#20744A66}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);background:var(--sidebar);color:var(--fg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:var(--sel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:none;stroke-width:1.75;display:block}
.ico{display:inline-flex;align-items:center}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.pulse::after{animation:none!important}}

/* ---------- mockup chrome ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--s0)}
.bar h1{font-size:13px;font-weight:600;margin:0 6px 0 0;white-space:nowrap}
.bar h1 span{color:var(--muted);font-weight:400}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--s2);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--s0);color:var(--fg);box-shadow:0 1px 2px #0000001f}
.btn{border:1px solid var(--border);background:var(--s0);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--s1)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.clock{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.canvas{display:flex;justify-content:center;padding:20px;min-height:0;overflow:hidden}
.side{border-left:1px solid var(--border);background:var(--s0);display:flex;flex-direction:column;min-height:0}
.side section{padding:14px 16px;border-bottom:1px solid var(--border)}
.side h2{font-size:12px;font-weight:600;margin:0 0 8px;color:var(--fg)}
.side p{margin:0;color:var(--muted);font-size:12.5px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rules li{font-size:12.5px;padding:4px 8px;border-radius:6px;color:var(--muted);transition:background .4s,color .4s}
.rules li b{color:var(--fg);font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
.rules li.hit{background:var(--s2);color:var(--fg)}
.log{flex:1;overflow:auto;padding:10px 16px 16px;display:flex;flex-direction:column;gap:6px}
.log div{font-size:12px;color:var(--muted);display:grid;grid-template-columns:40px 1fr;gap:6px}
.log div span:first-child{font-family:var(--mono);color:var(--xmuted);font-variant-numeric:tabular-nums}
.log div em{font-style:normal;color:var(--fg)}

/* ---------- Paseo frame ---------- */
.frame{width:min(920px,100%);height:100%;background:var(--s0);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 24px -12px #0000002e}
.frame.compact{width:390px}
.fhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.fhead .title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead .prov{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tl{flex:1;overflow:auto;padding:18px 0 28px}
.tl-inner{max-width:760px;margin:0 auto;padding:0 20px}
.compact .tl-inner{padding:0 12px}
.user{display:flex;justify-content:flex-end;margin:22px 0 14px}
.user:first-child{margin-top:0}
.user div{background:var(--s2);border-radius:14px;padding:8px 12px;max-width:80%}
.turnend{font-size:12px;color:var(--xmuted);margin:10px 0 0}
.composer{border-top:1px solid var(--border);padding:10px 14px}
.composer div{border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--xmuted);font-size:13.5px}

/* shared card atoms */
.sum.prose-sum{font-family:var(--ui);font-size:13px}
.sum{font-family:var(--mono);font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--muted)}
.st{display:inline-flex;color:var(--xmuted)}
.st svg.i{width:14px;height:14px}
.is-running .st,.is-running .ico{color:var(--fg)}
.is-failed .st,.is-failed .ico{color:var(--bad)}
.is-failed .sum,.is-failed .meta{color:var(--bad)}
.is-done .st{color:var(--ok)}
.is-canceled .sum{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--xmuted)}
.is-canceled .st{color:var(--muted)}
.hd{all:unset;box-sizing:border-box;cursor:pointer}
.hd.static{cursor:default}
.body{font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--fg);white-space:pre;overflow-x:auto;margin:0}
.body .add{color:var(--ok)}.body .del{color:var(--bad)}.body .hunk{color:var(--muted)}
.more{font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:4px}
.details{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-bottom:8px}
.details dt{color:var(--muted)}.details dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.errtext{font-family:var(--mono);font-size:12px;color:var(--bad);margin-top:8px;white-space:pre-wrap}
.prose{font-size:14px;line-height:1.6;color:var(--fg)}
.prose p{margin:0 0 8px}.prose p:last-child{margin:0}
.prose ul{margin:0 0 8px;padding-left:18px}
.prose code{font-family:var(--mono);font-size:12.5px;background:var(--s2);padding:1px 4px;border-radius:4px}
.thinking{font-size:13px;line-height:1.55;color:var(--muted);white-space:pre-wrap}
.caret::after{content:"";display:inline-block;width:6px;height:13px;margin-left:2px;vertical-align:-2px;background:var(--run);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ========== Style A · Pills ========== */
.s-pill .card{margin:4px 0}
.s-pill .pill{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:5px 12px 5px 10px;border-radius:999px;background:var(--s2)}
.s-pill .pill:hover{background:var(--s3)}
.s-pill .pill .ico{color:var(--muted)}
.s-pill .panel{border:1px solid var(--border);background:var(--s1);border-radius:14px;padding:4px;margin:6px 0}
.s-pill .panel>.hd{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:10px}
.s-pill .panel>.hd:hover{background:var(--s2)}
.s-pill .panel>.hd .sum{flex:1}
.s-pill .panel .bodywrap{padding:4px 10px 10px 32px}
.s-pill .is-running.panel{border-color:color-mix(in srgb,var(--run) 45%,var(--border))}
.s-pill .answer{display:grid;grid-template-columns:20px 1fr;gap:8px;margin:10px 0;align-items:start}
.s-pill .err{align-items:start}
.s-pill .answer .ico{color:var(--muted);margin-top:4px}
.s-pill .err{border-radius:14px;padding:10px 12px;margin:6px 0;background:color-mix(in srgb,var(--bad) 10%,var(--s0));display:grid;grid-template-columns:20px 1fr;gap:8px}
.s-pill .err .ico{color:var(--bad);margin-top:2px}
.compact.s-pill .is-done .pill .meta{display:none}

/* ========== Style B · Log ========== */
.s-log .card{margin:0}
.s-log .row{display:grid;grid-template-columns:18px 64px minmax(0,1fr) auto 16px;align-items:center;gap:10px;width:100%;min-height:30px;padding:0 8px;border-radius:6px}
.s-log .row:hover{background:var(--s1)}
.s-log .row .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.s-log .ico{color:var(--muted)}
.s-log .is-running .row{background:color-mix(in srgb,var(--run) 7%,transparent)}
.s-log .is-running .lbl{color:var(--fg);font-weight:600}
.s-log .bodywrap{margin:2px 8px 8px 100px;padding:8px 10px;background:var(--s1);border:1px solid var(--border);border-radius:6px}
.s-log .answer{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:8px 8px 10px}
.s-log .answer .ico{margin-top:4px}
.s-log .answer .prose{padding-left:74px}
.s-log .err{display:grid;grid-template-columns:18px 64px minmax(0,1fr);gap:10px;padding:6px 8px;align-items:start}
.s-log .err .ico,.s-log .err .lbl{color:var(--bad)}
.s-log .err .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.s-log .err .msg{font-size:13px;color:var(--fg)}
.compact.s-log .row{grid-template-columns:18px minmax(0,1fr) 16px;grid-template-areas:"i s st" ". m .";row-gap:0;padding:4px 6px}
.compact.s-log .row .lbl{display:none}
.compact.s-log .row .ico{grid-area:i}.compact.s-log .row .sum{grid-area:s}.compact.s-log .row .st{grid-area:st}
.compact.s-log .row .meta{grid-area:m;font-size:11.5px}
.compact.s-log .row .meta:empty{display:none}
.compact.s-log .bodywrap{margin-left:30px}
.compact.s-log .answer .prose{padding-left:0}
.compact.s-log .err{grid-template-columns:18px minmax(0,1fr)}
.compact.s-log .err .lbl{display:none}

/* ========== Style C · Spine ========== */
.s-spine .card{display:grid;grid-template-columns:52px 24px minmax(0,1fr);column-gap:10px;position:relative}
.s-spine .card::before{content:"";position:absolute;left:73px;top:0;bottom:0;width:1px;background:var(--border)}
.s-spine .card.first::before{top:14px}
.s-spine .card.last::before{bottom:calc(100% - 14px)}
.s-spine .time{font:11.5px var(--mono);color:var(--xmuted);text-align:right;padding-top:6px;font-variant-numeric:tabular-nums;line-height:1.3}
.s-spine .time small{display:block;font-size:10.5px}
.s-spine .node{position:relative;z-index:1;width:24px;height:24px;margin-top:2px;border-radius:50%;background:var(--s0);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.s-spine .node svg.i{width:13px;height:13px}
.s-spine .is-running .node{border-color:var(--run);color:var(--fg)}
.s-spine .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--run);opacity:0;animation:ring 1.6s cubic-bezier(.16,1,.3,1) infinite}
@keyframes ring{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
.s-spine .is-failed .node{border-color:var(--bad);color:var(--bad)}
.s-spine .is-done .node{color:var(--muted)}
.s-spine .content{padding:3px 0 10px;min-width:0}
.s-spine .hd{display:flex;align-items:baseline;gap:8px;width:100%;padding:2px 6px;margin-left:-6px;border-radius:6px}
.s-spine .hd:hover:not(.static){background:var(--s1)}
.s-spine .hd .lbl{font-weight:600;color:var(--fg);font-size:12.5px;flex:none}
.s-spine .hd .sum{flex:1}
.s-spine .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:1px}
.s-spine .sub .st svg.i{width:12px;height:12px}
.s-spine .bodywrap{margin-top:6px;padding:8px 10px;background:var(--s1);border:1px solid var(--border);border-radius:8px}
.s-spine .answer .prose{margin-top:2px}
.s-spine .err .msg{font-size:13px;margin-top:2px}
.s-spine .turnend{padding-left:96px}
.compact.s-spine .turnend{padding-left:76px}
.compact.s-spine .card{grid-template-columns:34px 24px minmax(0,1fr);column-gap:8px}
.compact.s-spine .card::before{left:53px}
.compact.s-spine .time small{display:none}

/* ========== Plugin off · approximated Paseo default ========== */
.s-off .drow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:4px 0}
.s-off .drow b{font-weight:500;color:var(--fg)}
.s-off .drow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-off .dans{margin:8px 0}
.s-off .derr{color:var(--bad);font-size:13px;margin:6px 0}

@media (max-width:1100px){.stage{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <h1>agent-activity <span>timeline card mockup</span></h1>
    <div class="grp"><label>Style</label><div class="seg" data-key="style">
      <button data-v="pill">A · Pills</button><button data-v="log">B · Log</button><button data-v="spine">C · Spine</button></div></div>
    <div class="grp"><label>Plugin</label><div class="seg" data-key="plugin">
      <button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="grp"><label>Provider</label><div class="seg" data-key="provider">
      <button data-v="claude">Claude Code</button><button data-v="codex">Codex</button><button data-v="omp">OMP</button></div></div>
    <div class="grp"><label>Theme</label><div class="seg" data-key="theme">
      <button data-v="light" aria-label="Light theme" data-icon="sun"></button><button data-v="dark" aria-label="Dark theme" data-icon="moon"></button></div></div>
    <div class="grp"><label>Layout</label><div class="seg" data-key="layout">
      <button data-v="desktop" aria-label="Desktop" data-icon="monitor"></button><button data-v="compact" aria-label="Compact" data-icon="smartphone"></button></div></div>
    <div class="grp">
      <button class="btn primary" id="play"></button>
      <button class="btn" id="step" data-icon="skip-forward">Step</button>
      <button class="btn" id="end">Finish turn</button>
      <button class="btn" id="reset" data-icon="rotate-ccw">Reset</button>
      <div class="seg" data-key="speed"><button data-v="0.5">0.5×</button><button data-v="1">1×</button><button data-v="2">2×</button></div>
      <span class="clock" id="clock">0:00</span>
    </div>
  </header>
  <div class="stage">
    <div class="canvas">
      <div class="frame" id="frame">
        <div class="fhead"><span class="title">Fix UTC date formatter</span><span class="prov" id="prov"></span></div>
        <div class="tl" id="tl"><div class="tl-inner" id="tlin"></div></div>
        <div class="composer"><div>Message the agent…</div></div>
      </div>
    </div>
    <aside class="side">
      <section><h2 id="optname"></h2><p id="optdesc"></p></section>
      <section><h2>Behavior rules</h2><ul class="rules" id="rules"></ul></section>
      <section style="border-bottom:0;padding-bottom:0"><h2>What just happened</h2></section>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>

function rPill(v,open){
  const [label,ic]=ACT[v.activity];const cls=`is-${v.status}`;
  if(v.activity==="answer")return `<div class="card answer ${cls}"><span class="ico">${svg(ic)}</span><div class="prose ${v.status==="running"?"caret":""}">${md(v.text||"")}</div></div>`;
  if(v.activity==="error")return `<div class="card err ${cls}"><span class="ico">${svg(ic)}</span><div><div class="lbl" style="color:var(--bad)">Error</div><div class="prose">${esc(v.summary)}</div></div></div>`;
  const head=`<span class="ico">${svg(ic)}</span><span class="lbl">${label}</span><span class="sum ${PROSE.has(v.activity)?"prose-sum":""}">${esc(v.summary)}</span>${v.meta?`<span class="meta">${esc(v.meta)}</span>`:""}${stIcon(v.status)}`;
  if(!open)return `<div class="card ${cls}"><button class="hd pill" data-id="${v.id}" ${aria(v,open)}>${head}</button></div>`;
  return `<div class="card panel ${cls}"><button class="hd" data-id="${v.id}" ${aria(v,open)}>${head}</button><div class="bodywrap">${bodyHtml(v)}</div></div>`;
}
function rLog(v,open){
  const [label,ic]=ACT[v.activity];const cls=`is-${v.status}`;
  if(v.activity==="answer")return `<div class="card answer ${cls}"><span class="ico">${svg(ic)}</span><div class="prose ${v.status==="running"?"caret":""}">${md(v.text||"")}</div></div>`;
  if(v.activity==="error")return `<div class="card err ${cls}"><span class="ico">${svg(ic)}</span><span class="lbl">Error</span><span class="msg">${esc(v.summary)}</span></div>`;
  return `<div class="card ${cls}"><button class="hd row" data-id="${v.id}" ${aria(v,open)}><span class="ico">${svg(ic)}</span><span class="lbl">${label}</span><span class="sum ${PROSE.has(v.activity)?"prose-sum":""}">${esc(v.summary)}</span><span class="meta">${esc(v.meta||"")}</span>${stIcon(v.status)}</button>${open?`<div class="bodywrap">${bodyHtml(v)}</div>`:""}</div>`;
}
function rSpine(v,open,pos){
  const [label,ic]=ACT[v.activity];const cls=`is-${v.status} ${pos}`;
  const time=`<div class="time">${fmt(v.t0-v.base)}<small>${dur(v)}</small></div>`;
  const node=`<div class="node ${v.status==="running"?"pulse":""}" aria-hidden="true">${svg(ic)}</div>`;
  if(v.activity==="answer")return `<div class="card answer ${cls}">${time}${node}<div class="content"><div class="hd static"><span class="lbl">Answer</span></div><div class="prose ${v.status==="running"?"caret":""}">${md(v.text||"")}</div></div></div>`;
  if(v.activity==="error")return `<div class="card err ${cls}">${time}${node}<div class="content"><div class="hd static"><span class="lbl" style="color:var(--bad)">Error</span></div><div class="msg">${esc(v.summary)}</div></div></div>`;
  return `<div class="card ${cls}">${time}${node}<div class="content"><button class="hd" data-id="${v.id}" ${aria(v,open)}><span class="lbl">${label}</span><span class="sum ${PROSE.has(v.activity)?"prose-sum":""}">${esc(v.summary)}</span></button><div class="sub">${stIcon(v.status)}<span>${esc(v.status==="running"?"running":v.status==="done"?"done":v.status)}</span>${v.meta?`<span>· ${esc(v.meta)}</span>`:""}</div>${open?`<div class="bodywrap">${bodyHtml(v)}</div>`:""}</div></div>`;
}
function rOff(v){
  const raw=v.activity==="think"?"Thinking":RAW[v.activity]?.[S.provider];
  if(v.activity==="answer")return `<div class="dans prose">${md(v.text||"")}</div>`;
  if(v.activity==="error")return `<div class="derr">${esc(v.summary)}</div>`;
  const ic=v.status==="running"?svg("loader-circle","spin"):svg("chevron-right");
  const tail=v.activity==="think"?"":` <span>${esc(v.summary)}</span>`;
  return `<div class="drow">${ic}<b>${esc(raw)}</b>${tail}</div>`;
}

function render(){
  const frame=document.getElementById("frame");
  document.body.className="t-"+S.theme;
  frame.className=`frame ${S.layout==="compact"?"compact":""} s-${S.plugin==="off"?"off":S.style}`;
  document.getElementById("prov").textContent=PROV[S.provider];
  const all=[...HIST.map(x=>({...x,base:0})),...S.items.map(x=>({...x,base:0}))];
  let html="",turn=[];
  const flush=()=>{turn.forEach((v,i)=>{const pos=(i===0?"first ":"")+(i===turn.length-1?"last":"");const open=isOpen(v);
    html+=S.plugin==="off"?rOff(v):S.style==="pill"?rPill(v,open):S.style==="log"?rLog(v,open):rSpine(v,open,pos);});turn=[];};
  let base=0;
  for(const x of all){
    if(x.kind==="user"){flush();base=x.t0??0;html+=`<div class="user"><div>${esc(x.text)}</div></div>`;continue}
    if(x.kind==="end"){flush();html+=`<div class="turnend">${esc(x.text)}</div>`;continue}
    const v=view(x);v.base=base;turn.push(v);
  }
  flush();
  const tl=document.getElementById("tl");const atBottom=tl.scrollHeight-tl.scrollTop-tl.clientHeight<60;
  document.getElementById("tlin").innerHTML=html;
  if(S.playing||atBottom)tl.scrollTop=tl.scrollHeight;
  document.getElementById("clock").textContent=fmt(S.clock);
  const [n,d]=OPTS[S.style];document.getElementById("optname").textContent=S.plugin==="off"?"Plugin off · Paseo default (approximation)":n;
  document.getElementById("optdesc").textContent=S.plugin==="off"?"Disabling or removing the plugin drops its transformers, so Paseo draws its own collapsed tool rows and plain text again. Nothing is lost, because the plugin never writes to the daemon.":d;
  document.getElementById("rules").innerHTML=RULES.map(([id,t])=>`<li class="${S.hit===id?"hit":""}"><b>${id}</b>${esc(t)}</li>`).join("");
  document.getElementById("log").innerHTML=S.log.map(e=>`<div><span>${fmt(e.t)}</span><span>${e.html}</span></div>`).join("")||`<div><span></span><span>Press Play to run a live turn under the finished one above.</span></div>`;
  document.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(String(S[seg.dataset.key]??"")===b.dataset.v))));
  document.getElementById("play").innerHTML=S.playing?`${svg("pause")}Pause`:`${svg("play")}${S.ci>=SCRIPT.length?"Replay":"Play"}`;
}

/* ---------- clock ---------- */
function runUntil(t){
  while(S.ci<SCRIPT.length&&SCRIPT[S.ci].t<=t){const e=SCRIPT[S.ci++];S.clock=e.t;const before=S.items.length;e.fn();if(S.items.length>before)addLogStart(S.items[S.items.length-1]);}
  S.clock=Math.min(t,SCRIPT.length?SCRIPT[SCRIPT.length-1].t:t);
}
function reset(){S.items=[];S.log=[];S.clock=0;S.ci=0;S.hit=null;S.playing=false;SCRIPT=buildScript();}
let last=0;
function tick(ts){
  if(S.playing){const dt=last?Math.min(100,ts-last):0;runUntil(S.clock+dt*Number(S.speed));render();}
  last=ts;requestAnimationFrame(tick);
}

/* ---------- events ---------- */
document.querySelectorAll("[data-icon]").forEach(b=>b.insertAdjacentHTML("afterbegin",svg(b.dataset.icon)));
document.querySelectorAll(".seg").forEach(seg=>seg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  const k=seg.dataset.key;S[k]=k==="plugin"?b.dataset.v:b.dataset.v;
  if(k==="provider")log(`Switched to <em>${esc(PROV[S.provider].split(" · ")[0])}</em>: same cards, only the raw tool name changes`,"R7");
  render();}));
document.getElementById("tl").addEventListener("click",e=>{const b=e.target.closest("button.hd[data-id]");if(!b)return;
  const id=b.dataset.id;const it=get(id)||HIST.find(x=>x.id===id);const open=isOpen(it);it.manual=!open;
  const name=`${ACT[it.activity][0]} · ${it.summary||firstLine(it.text)}`;
  log(`You ${open?"closed":"opened"} <em>${esc(name)}</em>${it.status==="running"?"; it stays that way when it finishes":""}`,"R3");render();});
document.getElementById("play").onclick=()=>{if(S.ci>=SCRIPT.length){reset();}S.playing=!S.playing;last=0;render();};
document.getElementById("step").onclick=()=>{S.playing=false;const sig=()=>S.items.map(x=>x.id+x.status).join();const a=sig();
  while(S.ci<SCRIPT.length&&sig()===a)runUntil(SCRIPT[S.ci].t);render();};
document.getElementById("end").onclick=()=>{S.playing=false;runUntil(1e9);render();};
document.getElementById("reset").onclick=()=>{reset();HIST.forEach(h=>delete h.manual);log("History loaded collapsed","R6");render();};
reset();log("History loaded collapsed","R6");render();requestAnimationFrame(tick);
</script>
</body>
</html>
